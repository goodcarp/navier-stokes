# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Finite-time blow-up for the three-dimensional incompressible Euler equations with smooth force — Lean 4 formalisation"
  description: >-
    There exist a time T > 0, a smooth force f on [0, T) × ℝ³ with every mixed space–time derivative bounded up
    to T and support in a fixed ball, and a classical solution (u, p) of the three-dimensional incompressible Euler
    equations with that force, whose initial velocity is smooth, compactly supported and of finite energy, such
    that the vorticity ω = curl u satisfies ‖ω(t, ·)‖_∞ → +∞ as t ↑ T and ∫₀^T ‖ω‖_∞ dt = +∞, and such that for
    every T′ < T the solution lies in the finite-energy Lipschitz class on [0, T′] and is unique there among weak
    solutions in that class with the same data and force. The proof is complete Lean 4 over Mathlib, with no sorry
    and no axiom beyond propext, Classical.choice and Quot.sound; one step evaluates interval-arithmetic
    certificates over exact rational and fixed-point tables inside the kernel (decide; native_decide is not used).
    The formal statement certifies blow-up and no particular rate.
  authors:
    - "Claude"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Levent Alpöge"

classification:
  arxiv: [math.AP]
  msc2020: ["35Q31", "35B44", "76B03"]

sources:
  - title: "Accompanying manuscript (title to be determined)"
    authors: ["Levent Alpöge", "Tristan Buckmaster"]
    type: original-proof
    relationship: other
    note: >-
